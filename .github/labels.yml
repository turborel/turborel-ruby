# Kinds
- name: "bug"
  color: "#d73a4a"
  description: "The driver fails, crashes, hangs, or reads or sends a value wrongly"
- name: "conformance"
  color: "#5c282b"
  description: "A departure from the protocol spec or from turborel-client"
- name: "performance"
  color: "#fbca04"
  description: "Slower than it was or should be, or too much memory"
- name: "feature"
  color: "#a2eeef"
  description: "Something the driver should do that it does not"
- name: "documentation"
  color: "#0075ca"
  description: "Improvements or additions to documentation"

# Impact
- name: "impact/wrong-result"
  color: "#b60205"
  description: "A value or a row read or sent wrongly"
- name: "impact/crash"
  color: "#b60205"
  description: "An exception that is not a Turborel::Error, an abort or a hang"
- name: "impact/regression"
  color: "#b60205"
  description: "Worked, or was faster, at an earlier commit"

# Areas
- name: "area/codec"
  color: "#c5def5"
  description: "lib/turborel/protocol/: frames, fields, the tail, types and values, JSON, compression"
- name: "area/transport"
  color: "#c5def5"
  description: "TCP, Unix sockets, named pipes, timeouts"
- name: "area/auth"
  color: "#c5def5"
  description: "The mechanisms, SCRAM and its key cache"
- name: "area/tls"
  color: "#c5def5"
  description: "TLS, its verification and channel binding"
- name: "area/session"
  color: "#c5def5"
  description: "Hello, Ready, Status, notices, conditions, cancel, terminate, ping, reset, change-user"
- name: "area/statements"
  color: "#c5def5"
  description: "Queries, prepared statements, cursors, describe, completions"
- name: "area/lobs"
  color: "#c5def5"
  description: "Large objects, their locators and streams"
- name: "area/copy"
  color: "#c5def5"
  description: "Copy, import and export"
- name: "area/settings"
  color: "#c5def5"
  description: "The URI, options, variables, service and password files, several hosts, roles"
- name: "area/pipeline"
  color: "#c5def5"
  description: "Pipelines"
- name: "area/pool"
  color: "#c5def5"
  description: "Pools"
- name: "area/api"
  color: "#c5def5"
  description: "The plain API and the ActiveRecord adapter"
- name: "area/doc"
  color: "#c5def5"
  description: "doc/, README.md, RULES.md, CONFORMANCE.md, TODO.md, VERSIONING.md, AGENTS.md, CONTRIBUTING.md"
- name: "area/ci"
  color: "#c5def5"
  description: "The workflows, issue forms, labels and hooks in .github/ and .githooks/"
- name: "area/build"
  color: "#c5def5"
  description: "The gemspec, Gemfile, Rakefile, rakelib/ and the tools' configurations"
- name: "dependencies"
  color: "#0366d6"
  description: "A dependency or the Rubies tested change (R-SAFE-2, R-CM-1)"

# Triage
- name: "duplicate"
  color: "#cfd3d7"
  description: "This issue or pull request already exists"
- name: "invalid"
  color: "#e4e669"
  description: "This doesn't seem right"
- name: "question"
  color: "#d876e3"
  description: "Further information is requested"
- name: "wontfix"
  color: "#ffffff"
  description: "This will not be worked on"
- name: "good first issue"
  color: "#7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "#008672"
  description: "Extra attention is needed"
