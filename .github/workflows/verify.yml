# Every check a change must pass (RULES.md R-PROC-1), on each platform the
# driver claims to run on and each Ruby it supports (D3, R-PLAT-1), plus
# coverage and its floors (R-COV). setup-ruby installs the gems
# Gemfile.lock pins (D10), and caches them.
#
# The live tests (R-TEST-8) run on Linux, against Turborel's nightly image,
# started by test/server/live_server.rb with the host's network, its
# certificates made for the run. macOS and Windows runners have no Linux
# container engine, and the nightly pre-release's binaries are built only
# when Turborel's main passes its checks, so they may predate the protocol
# this driver speaks; there the live tests skip, as they do wherever
# TURBOREL_TEST_SERVER is not set.
name: verify

# A pull request is checked once, through pull_request, and main again once
# it is merged.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces its checks still running.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NIGHTLY: ghcr.io/turborel/turborel:nightly

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ["3.3", "3.4", "4.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Take the nightly server (Linux)
        if: runner.os == 'Linux'
        run: |
          docker pull "$NIGHTLY"
          echo "TURBOREL_TEST_SERVER=docker:$NIGHTLY" >> "$GITHUB_ENV"
      # The checks of `rake verify`, a step each, so a failure names its
      # check.
      - name: RuboCop
        run: bundle exec rake rubocop
      - name: Rules
        run: bundle exec rake rules
      - name: Steep
        run: bundle exec rake steep
      - name: RBS
        run: bundle exec rake rbs
      - name: YARD
        run: bundle exec rake doc
      - name: Tests
        timeout-minutes: 30
        run: bundle exec rake test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Take the nightly server
        run: |
          docker pull "$NIGHTLY"
          echo "TURBOREL_TEST_SERVER=docker:$NIGHTLY" >> "$GITHUB_ENV"
      - name: Coverage
        run: bundle exec rake coverage
