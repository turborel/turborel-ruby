name: Conformance
description: The driver departs from the protocol spec or from turborel-client.
labels: ["conformance"]
body:
  - type: markdown
    attributes:
      value: |
        Check CONFORMANCE.md first: a row not yet done is open work, and the choices listed there are not departures.
        The spec is turborel's doc/client/05-protocol.md; turborel-client's features are in doc/client/02-library.md and 02-library-connections.md. Where the spec and turborel-client's code differ, the code is right.
  - type: dropdown
    id: source
    attributes:
      label: Departs from
      options:
        - The protocol spec (05-protocol.md)
        - turborel-client's behaviour or its chapters (02-library.md, 02-library-connections.md)
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: The section
      description: Its heading, as printed, e.g. "Frames", "Pipelines".
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: What it says
      description: Quote the section, or point to turborel-client's code.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Program
      description: The smallest Ruby program that shows the departure.
      render: ruby
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What the spec or turborel-client does
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What the driver does
      description: Its result, or its error's SQLCODE, SQLSTATE and message.
      render: text
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short=12 HEAD`"
    validations:
      required: true
