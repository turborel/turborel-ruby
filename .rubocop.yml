# RuboCop, strictly (RULES.md R-STYLE-1, R-LINT-1, R-LINT-2): every offense fails
# `rake verify`, and cops new in a later RuboCop are on as they come.
plugins:
  - rubocop-minitest
  - rubocop-performance
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  DisplayCopNames: true
  DisplayStyleGuide: true
  ExtraDetails: true
  Exclude:
    - "vendor/**/*"
    - "pkg/**/*"
    - "api/**/*"
    - "coverage/**/*"
    - ".claude/**/*"

# Lines end with LF on every platform, as .gitattributes checks them out
# (R-PLAT-3); the cop's default, native, would ask for CRLF on Windows.
Layout/EndOfLine:
  EnforcedStyle: lf

# Steep's inline type annotations, `#:`, are comments without the space
# (D11).
Layout/LeadingCommentSpace:
  AllowSteepAnnotation: true

# R-STYLE-1: one quoting, as the Ruby community's most common style has it.
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# R-SIZE-1 and R-SIZE-3: at most 50 lines and 5 parameters, keywords
# counted. Files are held to 600 lines by `rake rules` (R-SIZE-2).
Metrics/MethodLength:
  Max: 50
Metrics/ParameterLists:
  Max: 5
  CountKeywordArgs: true
Metrics/ClassLength:
  Max: 600
Metrics/ModuleLength:
  Max: 600
# A test is a list of assertions of one behaviour at each of its edges
# (R-TEST-2, R-TEST-4), which the ABC metric counts as branches; the
# library is held to it.
Metrics/AbcSize:
  Exclude:
    - "test/**/*"
Metrics/BlockLength:
  Exclude:
    - "*.gemspec"

# ActiveRecord's and Arel's visitors call a node's method by its class's
# name, visit_Arel_Nodes_Limit and the rest, so the adapter's own are named
# so (RULES.md D2).
Naming/MethodName:
  AllowedPatterns:
    - '\Avisit_'

# ActiveRecord asks an adapter for the server's version by
# get_database_version, a name of its own choosing (RULES.md D2).
Naming/AccessorMethodName:
  Exclude:
    - "lib/active_record/connection_adapters/turborel_adapter.rb"

# R-DOC-1: every public class, module and method is documented.
Style/Documentation:
  Enabled: true
Style/DocumentationMethod:
  Enabled: true

# R-LINT-3, D8: a cop is never disabled in source, only here, with its reason.
Style/DisableCopsWithinSourceCodeDirective:
  Enabled: true

# R-ERR-1: an error raised names its class, never a bare RuntimeError.
Style/ImplicitRuntimeError:
  Enabled: true

# R-NUM: a conversion that would read garbage as 0 is not written.
Lint/NumberConversion:
  Enabled: true

Style/RequireOrder:
  Enabled: true
Style/TopLevelMethodDefinition:
  Enabled: true
Style/MethodCalledOnDoEndBlock:
  Enabled: true

# A test asserts what one behaviour gives, at each edge of it (R-TEST-2).
Minitest/MultipleAssertions:
  Max: 8
